name = "bloom-portal"
main = "wFront.js"
compatibility_date = "2024-01-01"

# Le script du widget « Retours site » est importé comme texte brut
[[rules]]
type = "Text"
globs = ["**/*.widget.js"]
fallthrough = true

[[kv_namespaces]]
binding = "BLOOM_KV"
id = "9336bc6ddcca42bf8718546380c869d0"
preview_id = "9336bc6ddcca42bf8718546380c869d0"

[[services]]
binding = "BLOOM_BACK"
service = "bloom-portal-back"

[vars]
ENVIRONMENT = "production"

# Secrets to configure in Cloudflare dashboard:
# ADMIN_USERNAME, ADMIN_PASSWORD
